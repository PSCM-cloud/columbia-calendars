name: Update calendars

on:
  push:
    branches: [main]
    paths:
      - "update_calendars.py"
      - ".github/workflows/update-calendars.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml
      - run: python update_calendars.py
      - name: Publish changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theater.ics halle.ics
          git diff --cached --quiet || (git commit -m "Update venue calendars" && git push)
